{{- if and .Values.gpu .Values.gpu.devicePlugin .Values.gpu.devicePlugin.enabled }}
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: nvidia
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
handler: nvidia
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: nvidia-device-plugin
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: nvidia-device-plugin
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: nvidia-device-plugin
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nvidia-device-plugin
    spec:
      runtimeClassName: nvidia
      priorityClassName: system-node-critical
      {{- if .Values.gpu.devicePlugin.nodeSelector }}
      nodeSelector:
        {{- toYaml .Values.gpu.devicePlugin.nodeSelector | nindent 8 }}
      {{- end }}
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: nvidia-device-plugin-ctr
          image: {{ .Values.gpu.devicePlugin.image | default "nvcr.io/nvidia/k8s-device-plugin:v0.17.0" | quote }}
          env:
            - name: FAIL_ON_INIT_ERROR
              value: "false"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: device-plugin
              mountPath: /var/lib/kubelet/device-plugins
      volumes:
        - name: device-plugin
          hostPath:
            path: /var/lib/kubelet/device-plugins
{{- end }}
