{{- if .Values.ingress.enabled }}
{{- $host := .Values.ingress.host | default "chat.internal.cloud" -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: open-webui
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: open-webui
spec:
  ingressClassName: {{ .Values.ingress.ingressClassName | default "traefik" }}
  tls:
    - {{- if .Values.ingress.tlsSecretName }}
      secretName: {{ .Values.ingress.tlsSecretName | quote }}
      {{- end }}
      hosts:
        - {{ $host | quote }}
  rules:
    - host: {{ $host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: open-webui
                port:
                  number: {{ .Values.openWebui.port | default 8080 }}
{{- end }}
