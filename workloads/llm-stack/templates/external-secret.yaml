{{- if and .Values.credentialsSecret .Values.credentialsSecret.enabled }}
{{- $dbHost := .Values.openWebui.database.host | default "platform-postgres-rw.postgres-cluster.svc.cluster.local" -}}
{{- $dbPort := .Values.openWebui.database.port | default 5432 -}}
{{- $dbName := .Values.openWebui.database.name | default "appdb" -}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.credentialsSecret.secretName | default "llm-stack-secrets" }}
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: {{ .Values.credentialsSecret.refreshInterval | default "15m" | quote }}
  secretStoreRef:
    name: {{ .Values.credentialsSecret.secretStoreName | default "vault-homelab" }}
    kind: {{ .Values.credentialsSecret.secretStoreKind | default "ClusterSecretStore" }}
  target:
    name: {{ .Values.credentialsSecret.secretName | default "llm-stack-secrets" }}
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      data:
        DATABASE_URL: "postgresql://{{ `{{ .username }}` }}:{{ `{{ .password }}` }}@{{ $dbHost }}:{{ $dbPort }}/{{ $dbName }}"
        PGVECTOR_DB_URL: "postgresql://{{ `{{ .username }}` }}:{{ `{{ .password }}` }}@{{ $dbHost }}:{{ $dbPort }}/{{ $dbName }}"
        WEBUI_SECRET_KEY: "internal-cloud-open-webui-{{ `{{ .password }}` }}"
  data:
    - secretKey: username
      remoteRef:
        key: {{ .Values.credentialsSecret.postgresRemoteKey | default "workloads/postgres" }}
        property: username
    - secretKey: password
      remoteRef:
        key: {{ .Values.credentialsSecret.postgresRemoteKey | default "workloads/postgres" }}
        property: password
{{- end }}
