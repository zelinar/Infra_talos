{{- if and .Values.credentialsSecret .Values.credentialsSecret.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.credentialsSecret.secretName | default "platform-postgres-app-creds" }}
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: {{ .Values.credentialsSecret.refreshInterval | default "15m" | quote }}
  secretStoreRef:
    name: {{ .Values.credentialsSecret.secretStoreName | default "vault-homelab" }}
    kind: {{ .Values.credentialsSecret.secretStoreKind | default "ClusterSecretStore" }}
  target:
    name: {{ .Values.credentialsSecret.secretName | default "platform-postgres-app-creds" }}
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: kubernetes.io/basic-auth
  data:
    - secretKey: username
      remoteRef:
        key: {{ .Values.credentialsSecret.remoteKey | default "workloads/postgres" }}
        property: username
    - secretKey: password
      remoteRef:
        key: {{ .Values.credentialsSecret.remoteKey | default "workloads/postgres" }}
        property: password
{{- end }}
