clusterName: "platform-postgres"
instances: 2
imageName: "ghcr.io/cloudnative-pg/postgresql:16.6"

database:
  name: "appdb"
  owner: "appuser"
  postInitApplicationSQL:
    - "CREATE EXTENSION IF NOT EXISTS vector;"

storage:
  storageClass: "longhorn"
  size: "10Gi"

resources:
  requests:
    cpu: "100m"
    memory: "256Mi"
  limits:
    cpu: "1"
    memory: "1Gi"

monitoring:
  enablePodMonitor: true

# Sync database owner credentials from HashiCorp Vault via External Secrets Operator
credentialsSecret:
  enabled: true
  secretStoreName: "vault-homelab"
  secretStoreKind: "ClusterSecretStore"
  remoteKey: "workloads/postgres"
  secretName: "platform-postgres-app-creds"
  refreshInterval: "15m"

# Optional S3 continuous WAL archiving & scheduled backups (Barman Cloud)
backup:
  enabled: false
  destinationPath: "s3://homelab-backups/cnpg/"
  endpointURL: ""
  s3CredentialsSecretName: "longhorn-s3-credentials"
  accessKeyIdKey: "AWS_ACCESS_KEY_ID"
  secretAccessKeyKey: "AWS_SECRET_ACCESS_KEY"
  retentionPolicy: "14d"
  schedule: "0 0 3 * * *"
