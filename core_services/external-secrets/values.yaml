# ==============================================================================
# Cluster-Scoped Secret Stores & Optional Cluster External Secrets
# ==============================================================================

clusterSecretStores: {}

clusterSecrets:
  # Optional cluster-wide Docker Hub pull secret (synced from vault-homelab when enabled)
  dockerHubPull:
    enabled: false
    secretStoreName: "vault-homelab"
    secretStoreKind: "ClusterSecretStore"
    refreshInterval: "15m"
    items:
      - name: dockerhub-image-pull-secret
        targetTemplate:
          engineVersion: v2
          type: kubernetes.io/dockerconfigjson
          data:
            .dockerconfigjson: '{"auths":{"index.docker.io":{"auth":"{{ printf "%s:%s" .username .token | b64enc}}"}}}'
        data:
          - secretKey: username
            remoteKey: core/dockerhub
            remoteProperty: username
          - secretKey: token
            remoteKey: core/dockerhub
            remoteProperty: token

# ==============================================================================
# External Secrets Operator, Webhook & Cert Controller
# ==============================================================================

external-secrets:
  enabled: true
  installCRDs: true

  resources:
    requests:
      cpu: 10m
      memory: 80Mi
    limits:
      memory: 128Mi

  webhook:
    resources:
      requests:
        cpu: 5m
        memory: 48Mi
      limits:
        memory: 64Mi

  certController:
    resources:
      requests:
        cpu: 5m
        memory: 56Mi
      limits:
        memory: 64Mi
