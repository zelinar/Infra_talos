{{- range $groupName, $groupConf := .Values.clusterSecrets }}
{{- if $groupConf.enabled }}
{{- range $item := $groupConf.items }}
---
apiVersion: external-secrets.io/v1
kind: ClusterExternalSecret
metadata:
  name: {{ $item.name }}
spec:
  externalSecretName: {{ $item.name }}
  namespaceSelectors:
    - matchLabels: {}
  externalSecretSpec:
    refreshInterval: {{ $item.refreshInterval | default $groupConf.refreshInterval | default "15m" }}
    secretStoreRef:
      name: {{ $item.secretStoreName | default $groupConf.secretStoreName }}
      kind: {{ $item.secretStoreKind | default $groupConf.secretStoreKind | default "ClusterSecretStore" }}
    target:
      name: {{ $item.name }}
      creationPolicy: {{ $item.creationPolicy | default "Owner" }}
      {{- if $item.targetTemplate }}
      template:
        {{- toYaml $item.targetTemplate | nindent 8 }}
      {{- end }}
    data:
      {{- range $item.data }}
      - secretKey: {{ .secretKey }}
        remoteRef:
          key: {{ .remoteKey }}
          property: {{ .remoteProperty }}
      {{- end }}
{{- end }}
{{- end }}
{{- end }}
