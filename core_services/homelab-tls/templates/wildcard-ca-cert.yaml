{{- $domain := .Values.domain | default "homelab.cloud" -}}
{{- $issuer := .Values.issuerName | default "homelab-ca-issuer" -}}
{{- range $ns := (.Values.targetNamespaces | default (list "traefik" "monitoring")) }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $ns }}
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-homelab-crt
  namespace: {{ $ns }}
spec:
  isCA: false
  secretName: wildcard-homelab-secret
  issuerRef:
    name: {{ $issuer }}
    kind: ClusterIssuer
  commonName: {{ printf "*.%s" $domain | quote }}
  dnsNames:
    - {{ printf "*.%s" $domain | quote }}
    - {{ $domain | quote }}
{{- end }}
