{{- if .Values.rootCA.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.rootCA.secretName | default "homelab-ca-secret" }}
  namespace: {{ .Release.Namespace | default "cert-manager" }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
type: kubernetes.io/tls
data:
  tls.crt: {{ .Values.rootCA.crt | quote }}
  tls.key: {{ .Values.rootCA.key | quote }}
{{- end }}
