{{- range $groupName, $groupConf := .Values.secrets -}}
  {{- if $groupConf.enabled -}}
    {{- range $item := $groupConf.items }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $item.name }}
spec:
  refreshInterval: {{ $item.refreshInterval | default $groupConf.refreshInterval | default "15m" }}
  secretStoreRef:
    name: {{ $item.secretStoreName | default $groupConf.secretStoreName }}
    kind: {{ $item.secretStoreKind | default $groupConf.secretStoreKind }}
  target:
    name: {{ $item.name }}
    creationPolicy: {{ $item.creationPolicy | default "Owner" }}
    {{- if $item.targetTemplate }}
    template:
      {{- toYaml $item.targetTemplate | nindent 6 }}
    {{- end }}
  data:
    {{- range $item.data }}
    - secretKey: {{ .secretKey }}
      remoteRef:
        key: {{ .remoteKey }}
        property: {{ .remoteProperty }}
    {{- end }}
    {{- end }}
  {{- end }}
{{- end }}
