{{- range $name, $store := .Values.clusterSecretStores }}
{{- if $store.enabled }}
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ $name }}
spec:
  provider:
    {{- if eq $store.type "vault" }}
    vault:
      server: {{ $store.server | default (printf "https://%s.%s.svc.cluster.local:8200" $.Release.Name $.Release.Namespace) }}
      path: {{ $store.path | default "internal" }}
      version: "v2"
      {{- if not $store.skipCA }}
      caProvider:
        {{- $ca := $store.caProvider | default dict }}
        type: {{ $ca.type | default "Secret" }}
        name: {{ $ca.name | default (printf "%s-tls" $.Release.Name) }}
        namespace: {{ $ca.namespace | default $.Release.Namespace }}
        key: {{ $ca.key | default "ca.crt" }}
      {{- end }}
      auth:
        {{- if or (not $store.auth) $store.auth.kubernetes }}
        {{- $k8s := ($store.auth | default dict).kubernetes | default dict }}
        {{- $saRef := $k8s.serviceAccountRef | default dict }}
        kubernetes:
          mountPath: {{ $k8s.mountPath | default "kubernetes" }}
          role: {{ $k8s.role | default $.Release.Namespace }}
          serviceAccountRef:
            name: {{ $saRef.name | default $.Values.bankvaults.serviceAccount.name }}
            namespace: {{ $saRef.namespace | default $.Release.Namespace }}
        {{- else }}
        {{- toYaml $store.auth | nindent 8 }}
        {{- end }}
    {{- end }}
{{- end }}
{{- end }}
