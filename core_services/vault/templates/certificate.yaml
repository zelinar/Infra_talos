{{- if and $.Values.vault.ingress $.Values.vault.ingress.createCertificate $.Values.vault.ingress.tlsSecretName }}
{{- $domain := $.Values.vault.ingress.domain | default "internal.cloud" -}}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ $.Values.vault.ingress.certificateName | default "wildcard-homelab-crt" }}
  namespace: {{ $.Release.Namespace }}
spec:
  isCA: false
  secretName: {{ $.Values.vault.ingress.tlsSecretName }}
  issuerRef:
    name: {{ $.Values.vault.ingress.issuerName | default "homelab-ca-issuer" }}
    kind: ClusterIssuer
  commonName: {{ printf "*.%s" $domain | quote }}
  dnsNames:
    - {{ printf "*.%s" $domain | quote }}
    - {{ $domain | quote }}
{{- end }}
