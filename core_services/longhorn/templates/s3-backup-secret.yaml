{{- if and .Values.backup .Values.backup.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.backup.credentialSecretName | default "longhorn-s3-credentials" }}
  namespace: {{ .Release.Namespace | default "longhorn-system" }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: "15m"
  secretStoreRef:
    name: {{ .Values.backup.secretStoreName | default "vault-homelab" }}
    kind: {{ .Values.backup.secretStoreKind | default "ClusterSecretStore" }}
  target:
    name: {{ .Values.backup.credentialSecretName | default "longhorn-s3-credentials" }}
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: {{ .Values.backup.remoteKey | default "storage/longhorn-s3" }}
        property: access_key_id
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: {{ .Values.backup.remoteKey | default "storage/longhorn-s3" }}
        property: secret_access_key
    - secretKey: AWS_ENDPOINTS
      remoteRef:
        key: {{ .Values.backup.remoteKey | default "storage/longhorn-s3" }}
        property: endpoint
{{- end }}
