{{- if .Values.ingress.enabled }}
{{- $host := .Values.ingress.host | default "longhorn.internal.cloud" -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: longhorn-ui
  namespace: {{ .Release.Namespace | default "longhorn-system" }}
spec:
  ingressClassName: {{ .Values.ingress.ingressClassName | default "traefik" }}
  tls:
    - {{- if .Values.ingress.tlsSecretName }}
      secretName: {{ .Values.ingress.tlsSecretName | quote }}
      {{- end }}
      hosts:
        - {{ $host | quote }}
  rules:
    - host: {{ $host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: longhorn-frontend
                port:
                  number: 80
{{- end }}
