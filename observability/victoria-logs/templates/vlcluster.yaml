{{- $cfg := index .Values "victoria-logs" -}}
{{- if and $cfg $cfg.vlcluster $cfg.vlcluster.enabled }}
apiVersion: operator.victoriametrics.com/v1
kind: VLCluster
metadata:
  name: {{ default "vlcluster" $cfg.vlcluster.name }}
  {{- if $cfg.vlcluster.setNamespace }}
  namespace: {{ .Release.Namespace }}
  {{- end }}
  labels:
    {{- include "victoria-logs.labels" . | nindent 4 }}
  {{- with $cfg.vlcluster.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with $cfg.vlcluster.spec }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
{{- end }}
