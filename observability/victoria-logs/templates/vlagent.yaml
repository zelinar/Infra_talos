{{- /*
templates/vlagent.yaml

Renders a VLAgent custom resource from:
.Values["victoria-logs"].vlagent
*/ -}}
{{- $cfg := index .Values "victoria-logs" -}}
{{- if and $cfg $cfg.vlagent $cfg.vlagent.enabled -}}
{{- $root := . -}}
apiVersion: operator.victoriametrics.com/v1
kind: VLAgent
metadata:
  name: {{ default "vlcluster-agent" $cfg.vlagent.name }}
  {{- if $cfg.vlagent.setNamespace }}
  namespace: {{ $root.Release.Namespace }}
  {{- end }}
  labels:
    app.kubernetes.io/name: {{ $root.Chart.Name }}
    app.kubernetes.io/instance: {{ $root.Release.Name }}
    app.kubernetes.io/managed-by: {{ $root.Release.Service }}
    helm.sh/chart: {{ printf "%s-%s" $root.Chart.Name $root.Chart.Version | quote }}
  {{- with $cfg.vlagent.annotations }}
  annotations:
{{ toYaml . | indent 4 }}
  {{- end }}
spec:
{{- with $cfg.vlagent.spec }}
{{ toYaml . | indent 2 }}
{{- end }}
{{- end }}
