{{- $cfg := index .Values "victoria-metrics" -}}
{{- if and $cfg $cfg.vmcluster $cfg.vmcluster.enabled }}
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMCluster
metadata:
  name: {{ default "vmcluster" $cfg.vmcluster.name }}
  {{- if $cfg.vmcluster.setNamespace }}
  namespace: {{ .Release.Namespace }}
  {{- end }}
  labels:
    {{- include "victoria-metrics.labels" . | nindent 4 }}
  {{- with $cfg.vmcluster.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with $cfg.vmcluster.spec }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
{{- end }}
