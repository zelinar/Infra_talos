type: application
version: 1.0.0
appVersion: "v1.21.3"

dependencies:
  - name: alloy
    alias: alloy-linux-ds
    version: 1.14.4
    repository: https://grafana.github.io/helm-charts
    condition: alloy-linux-ds.enabled
