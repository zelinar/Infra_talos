apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-linux-ds-config
  labels:
    {{- include "alloy-daemonsets.labels" . | nindent 4 }}
data:
  config.alloy: |
{{ include "alloy-daemonsets.renderAlloySections" (dict "root" $ctx "config" $cfg) | indent 4 }}
