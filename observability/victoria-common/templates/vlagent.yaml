{{- $cfg := (index .Values "victoria-common" "vlagent") | default dict -}}
{{- if $cfg.enabled }}
apiVersion: operator.victoriametrics.com/v1
kind: VLAgent
metadata:
  name: {{ required "victoria-common.vlagent.name is required" $cfg.name }}
  {{- if $cfg.setNamespace }}
  namespace: {{ .Release.Namespace }}
  {{- end }}
  {{- with $cfg.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if $cfg.spec }}
  {{- toYaml $cfg.spec | nindent 2 }}
  {{- else }}
  {}
  {{- end }}
{{- end }}
