{{- $cfg := (index .Values "victoria-common" "vmalertmanager") | default dict -}}
{{- if $cfg.enabled -}}
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMAlertmanager
metadata:
  name: {{ required "victoria-common.vmalertmanager.name is required" $cfg.name }}
  {{- if $cfg.setNamespace }}
  namespace: {{ .Release.Namespace }}
  {{- end }}
  labels:
    app.kubernetes.io/name: {{ $cfg.name }}
    {{- if $cfg.extraLabels }}
    {{- toYaml $cfg.extraLabels | nindent 4 }}
    {{- end }}
  {{- with $cfg.annotations }}
  annotations:
{{ toYaml . | nindent 4 }}
  {{- end }}
spec:
{{- if $cfg.spec }}
{{ toYaml $cfg.spec | nindent 2 }}
{{- else }}
  {}
{{- end }}
{{- end }}
