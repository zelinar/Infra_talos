{{- $cfg := (index .Values "victoria-common" "vmalertmanagerconfig") | default dict -}}
{{- if $cfg.enabled -}}
{{- $namePrefix := $cfg.namePrefix | default "" -}}
{{- range $i, $c := ($cfg.configs | default list) -}}
{{- if $c.enabled -}}
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMAlertmanagerConfig
metadata:
  name: {{ printf "%s%s" $namePrefix (required "victoria-common.vmalertmanagerconfig.configs[].name is required" $c.name) }}
  {{- if $cfg.setNamespace }}
  namespace: {{ $.Release.Namespace }}
  {{- end }}
  {{- with ($cfg.annotations | default dict) }}
  annotations:
{{ toYaml . | nindent 4 }}
  {{- end }}
spec:
{{- if $c.spec }}
{{ toYaml $c.spec | nindent 2 }}
{{- else }}
  {}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
