{{- $vCommon := index .Values "victoria-common" | default dict -}}
{{- $static := get $vCommon "staticSecrets" | default dict -}}
{{- if (get $static "enabled") -}}
{{- $ns := default .Release.Namespace (get $vCommon "deploymentNamespace") -}}
{{- $alloyToken := default "homelab-alloy-collect-token-active" (get $static "alloyActiveToken") -}}
{{- $victoriaToken := default "homelab-victoria-ingest-token-active" (get $static "victoriaActiveToken") -}}
---
apiVersion: v1
kind: Secret
metadata:
  name: alloy-active-token
  namespace: {{ $ns | quote }}
type: Opaque
stringData:
  token: {{ $alloyToken | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: victoria-active-token
  namespace: {{ $ns | quote }}
type: Opaque
stringData:
  token: {{ $victoriaToken | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: victoria-internal-auth-tokens
  namespace: {{ $ns | quote }}
type: Opaque
stringData:
  collect_active_token: {{ $alloyToken | quote }}
  ingest_active_token: {{ $victoriaToken | quote }}
{{- end -}}
