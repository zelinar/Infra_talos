{{- $vCommon := index .Values "victoria-common" -}}
{{- if and $vCommon $vCommon.credentialsSecret $vCommon.credentialsSecret.enabled }}
{{- $defaultPrefix := $vCommon.credentialsSecret.remoteKeyPrefix -}}
{{- $defaultRefresh := $vCommon.credentialsSecret.refreshInterval | default "1h" -}}
{{- $items := default list $vCommon.credentialsSecret.items -}}
{{- $extra := default list $vCommon.credentialsSecret.extraItems -}}
{{- $allItems := concat $items $extra -}}
{{- range $item := $allItems }}
{{- $itemEnabled := true -}}
{{- if hasKey $item "enabled" -}}
{{- $itemEnabled = $item.enabled -}}
{{- end -}}
{{- if $itemEnabled }}
{{- $itemPrefix := default $defaultPrefix $item.remoteKeyPrefix -}}
{{- $itemRefresh := default $defaultRefresh $item.refreshInterval }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ $item.name }}
  namespace: {{ $vCommon.deploymentNamespace | quote }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    {{- with $vCommon.credentialsSecret.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  refreshInterval: {{ $itemRefresh | quote }}
  secretStoreRef:
    name: {{ $vCommon.credentialsSecret.secretStoreName }}
    kind: {{ $vCommon.credentialsSecret.secretStoreKind }}
  target:
    name: {{ $item.name }}
    creationPolicy: Owner
    deletionPolicy: Retain
    {{- with $item.template }}
    template:
      engineVersion: v2
      mergePolicy: Replace
      data:
{{ toYaml . | indent 8 }}
    {{- end }}
  data:
    {{- range $item.data }}
    - secretKey: {{ .secretKey }}
      remoteRef:
        key: {{ $itemPrefix }}
        property: {{ .remoteProperty }}
    {{- end }}
{{- end }}
{{- end }}
{{- end }}
