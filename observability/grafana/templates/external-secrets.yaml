{{- if and .Values.credentialsSecret .Values.credentialsSecret.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.credentialsSecret.secretName | default "grafana-admin-secret" }}
  namespace: {{ .Release.Namespace | quote }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: {{ .Values.credentialsSecret.refreshInterval | default "10m" | quote }}
  secretStoreRef:
    name: {{ .Values.credentialsSecret.secretStoreName | default "vault-homelab" }}
    kind: {{ .Values.credentialsSecret.secretStoreKind | default "ClusterSecretStore" }}
  target:
    name: {{ .Values.credentialsSecret.secretName | default "grafana-admin-secret" }}
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: admin-user
      remoteRef:
        key: {{ .Values.credentialsSecret.remoteKey | default "observability/grafana" }}
        property: admin-user
    - secretKey: admin-password
      remoteRef:
        key: {{ .Values.credentialsSecret.remoteKey | default "observability/grafana" }}
        property: admin-password
{{- end }}
