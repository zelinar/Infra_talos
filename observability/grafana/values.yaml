# ==============================================================================
# Vault / External Secrets Integration ('internal' KV v2 Engine)
# ==============================================================================

credentialsSecret:
  enabled: true
  secretStoreName: "vault-homelab"
  secretStoreKind: "ClusterSecretStore"
  remoteKey: "observability/grafana"
  secretName: "grafana-admin-secret"
  refreshInterval: "10m"

# ==============================================================================
# Grafana Server, Ingress, Storage & Datasources
# ==============================================================================

grafana:
  enabled: true
  replicas: 1

  image:
    tag: "12.3.2"

  plugins:
    - victoriametrics-metrics-datasource
    - victoriametrics-logs-datasource

  admin:
    existingSecret: "grafana-admin-secret"
    userKey: "admin-user"
    passwordKey: "admin-password"

  deploymentStrategy:
    type: RollingUpdate

  podAnnotations: {}
  deploymentAnnotations:
    reloader.stakater.com/auto: "true"

  service:
    type: ClusterIP
    port: 80

  ingress:
    enabled: true
    ingressClassName: "traefik"
    path: /
    pathType: Prefix
    hosts:
      - "grafana.internal.cloud"
    tls:
      - hosts:
          - "grafana.internal.cloud"
        secretName: "wildcard-homelab-secret"

  grafana.ini:
    server:
      root_url: "https://grafana.internal.cloud/"
      domain: "grafana.internal.cloud"
    analytics:
      reporting_enabled: false
      check_for_updates: true

  persistence:
    enabled: true
    type: pvc
    storageClassName: "longhorn"
    size: "10Gi"
    accessModes:
      - ReadWriteOnce

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi

  # Pre-provisioned VictoriaMetrics & VictoriaLogs Datasources
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        # Prometheus-compatible query endpoint (VMSelect)
        - name: Prometheus
          type: prometheus
          access: proxy
          url: "http://vmselect-vmcluster.monitoring.svc:8481/select/0/prometheus"
          isDefault: true
          editable: true

        # Native VictoriaMetrics datasource plugin (VMSelect)
        - name: VictoriaMetrics
          type: victoriametrics-metrics-datasource
          access: proxy
          url: "http://vmselect-vmcluster.monitoring.svc:8481/select/0/prometheus"
          isDefault: false
          editable: true

        # VictoriaLogs datasource plugin (VLSelect)
        - name: VictoriaLogs
          type: victoriametrics-logs-datasource
          access: proxy
          url: "http://vlselect-vlcluster.monitoring.svc:9471"
          editable: true
